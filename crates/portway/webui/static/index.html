<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>portway</title>
  <link rel="icon" id="favicon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/boot.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#events-list">Skip to events</a>

  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 75.28" aria-hidden="true"><path class="arch" d="M 85.28 26.50 L 84.79 24.75 C 84.33 23.13 83.67 21.57 82.98 20.05 L 82.01 18.09 L 81.24 16.76 C 80.50 15.60 79.74 14.49 78.91 13.40 C 77.88 12.06 76.77 10.84 75.56 9.66 L 73.75 8.06 L 71.54 6.36 C 70.01 5.31 68.39 4.33 66.73 3.52 C 65.44 2.90 64.11 2.33 62.75 1.87 C 61.11 1.32 59.36 0.83 57.64 0.56 C 55.68 0.25 53.67 0.00 51.68 0.01 C 50.26 0.02 48.84 0.05 47.43 0.24 C 46.22 0.41 44.96 0.60 43.78 0.90 C 42.68 1.17 41.63 1.45 40.55 1.82 C 38.97 2.36 37.48 3.02 35.99 3.77 L 34.47 4.61 C 32.49 5.72 30.64 7.11 28.92 8.58 C 28.05 9.33 27.15 10.16 26.38 11.01 C 25.39 12.12 24.47 13.20 23.60 14.41 C 22.51 15.93 21.60 17.39 20.76 19.06 C 19.67 21.24 18.77 23.46 18.15 25.82 L 17.65 27.83 C 17.26 29.80 17.03 31.82 16.95 33.82 L 16.96 46.48 L 18.36 45.62 C 20.39 44.31 22.58 43.28 24.76 42.25 C 27.17 41.11 29.63 40.21 32.13 39.28 L 33.72 38.77 L 33.68 34.63 C 33.69 33.37 33.93 32.16 34.17 30.93 C 34.40 29.71 34.87 28.55 35.40 27.43 C 36.23 25.67 37.43 24.00 38.81 22.62 C 39.89 21.53 41.22 20.52 42.57 19.79 C 43.97 19.02 45.54 18.40 47.10 18.06 C 49.14 17.62 51.32 17.51 53.39 17.80 C 55.21 18.05 57.16 18.62 58.78 19.48 C 60.18 20.23 61.55 21.06 62.69 22.17 C 63.66 23.11 64.53 24.06 65.29 25.19 C 65.83 26.00 66.35 26.82 66.73 27.72 C 66.96 28.18 67.17 28.79 67.33 29.30 C 67.86 30.89 68.18 32.51 68.26 34.18 L 68.23 36.98 L 68.23 55.77 L 68.20 75.27 L 86.26 75.26 L 86.27 69.36 L 86.28 49.99 L 86.28 34.53 C 86.28 32.36 86.01 30.22 85.65 28.08 L 85.28 26.50 Z"/><path class="road" d="M 68.23 36.98 L 68.26 34.18 C 68.18 32.51 67.86 30.89 67.33 29.30 C 67.17 28.79 66.96 28.18 66.73 27.72 L 62.90 29.67 L 59.52 31.09 L 56.52 32.24 L 52.47 33.56 L 49.88 34.22 L 47.06 34.99 L 45.22 35.34 L 39.72 36.84 L 35.78 38.03 C 35.11 38.30 34.36 38.45 33.72 38.77 L 32.13 39.28 C 29.63 40.21 27.17 41.11 24.76 42.25 C 22.58 43.28 20.39 44.31 18.36 45.62 L 16.96 46.48 L 14.69 48.03 C 13.51 48.90 12.37 49.82 11.28 50.       <span>portway</span>
    </div>
    <div class="listen">
      <code id="listen">—</code>
      <button type="button" class="icon" id="copy-listen" title="Copy the forwarder address" aria-label="Copy the forwarder address">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" /><path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2" /></svg>
      </button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grow"></div>
    <div class="actions">
      <span class="pill" id="conn" role="status" aria-live="polite">connecting</span>
      <button type="button" id="reload" title="Reread the configuration (r)">Reload</button>
      <button type="button" id="stop" class="danger" title="Stop the forwarder (q)">Stop</button>
      <button type="button" id="open-palette" class="ghost" title="Commands (⌘K / Ctrl-K)" aria-label="Commands"><span class="label">Commands</span> <kbd>⌘K</kbd></button>
      <button type="button" id="open-help" class="icon" title="Keys (?)" aria-label="Keyboard shortcuts">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" /><path d="M6 6.2a2 2 0 1 1 2.8 1.8c-.6.3-.8.7-.8 1.3M8 11.6h0" /></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" aria-label="Views">
    <a href="#/" data-view="dashboard">Dashboard</a>
    <a href="#/usage" data-view="usage">Usage</a>
    <a href="#/history" data-view="history">History</a>
    <a href="#/insights" data-view="insights">Insights</a>
    <a href="#/appearance" data-view="appearance">Appearance</a>
  </nav>

  <div class="banner" id="banner" hidden></div>

  <main id="main">
    <section id="view-dashboard" class="view" aria-label="Dashboard">
      <section class="stats" id="hud" aria-label="Totals"></section>

      <div class="board">
        <div class="board-main">
          <section class="panel models" aria-labelledby="models-title">
            <div class="panel-head">
              <h2 id="models-title">Upstreams</h2>
              <span class="hint">click a row to filter the events</span>
              <span class="hint" id="models-unused"></span>
            </div>
            <div class="table-wrap"><table id="models"></table></div>
          </section>

          <section class="panel events" aria-labelledby="events-title">
            <div class="toolbar">
              <h2 id="events-title">Events</h2>
              <label class="search">
                <span class="sr-only">Search events</span>
                <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" /></svg>
                <input type="search" id="query" placeholder="Search · status:5xx  model:  ttfb:>2s  is:cut" autocomplete="off" spellcheck="false">
                <kbd>/</kbd>
              </label>
              <button type="button" class="ghost" id="columns-button" title="Choose what a line shows (c)">Columns</button>
              <button type="button" class="ghost" id="export-csv" title="Download the filtered events as CSV">CSV</button>
              <button type="button" class="ghost" id="export-json" title="Download the filtered events as JSON">JSON</button>
            </div>
            <div class="query-errors" id="query-errors" role="alert"></div>
            <div class="list-status">
              <div class="segmented" role="group" aria-label="Filter" id="modes"></div>
              <div class="grow"></div>
              <span id="position"></span>
              <span id="counts"></span>
              <button type="button" class="link" id="load-older">Load older</button>
            </div>
            <div class="list" id="events-list" tabindex="0" role="listbox" aria-label="Events, newest last">
              <div class="head" id="events-head" aria-hidden="true"></div>
              <div class="spacer" id="events-spacer"></div>
              <div class="rows" id="events-rows"></div>
            </div>
          </section>
        </div>

        <aside class="board-rail">
          <section class="panel flights" id="flights" aria-labelledby="flights-title">
            <button type="button" class="flights-head" id="flights-toggle" aria-expanded="true" aria-controls="flights-rows">
              <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
              <span id="flights-title">In flight</span>
              <span class="count" id="flights-count">0</span>
              <span class="hint" id="flights-oldest"></span>
            </button>
            <div class="flights-rows" id="flights-rows"></div>
          </section>

          <figure class="panel chart">
            <figcaption>
              <h2>Request body per turn</h2>
              <span class="legend"><i class="swatch raw"></i>raw <i class="swatch wire"></i>wire <span id="bars-note"></span></span>
            </figcaption>
            <canvas id="bars-chart" role="img" aria-label="Request body size per turn, raw against wire"></canvas>
          </figure>
          <figure class="panel chart">
            <figcaption>
              <h2>Socket bytes/s</h2>
              <span class="legend">
                <span class="segmented" role="group" aria-label="Bucket width" id="scale"></span>
              </span>
            </figcaption>
            <canvas id="traffic-chart" role="img" aria-label="Socket bytes per second, up and down"></canvas>
          </figure>
        </aside>
      </div>
    </section>

    <section id="view-usage" class="view" aria-label="Usage" hidden></section>
    <section id="view-history" class="view" aria-label="History" hidden></section>
    <section id="view-insights" class="view" aria-label="Insights" hidden></section>
    <section id="view-appearance" class="view" aria-label="Appearance" hidden></section>
  </main>

  <dialog id="detail" class="drawer" aria-labelledby="detail-title"></dialog>
  <dialog id="help" aria-labelledby="help-title"></dialog>
  <dialog id="columns" aria-labelledby="columns-title"></dialog>
  <dialog id="stop-dialog" aria-labelledby="stop-title"></dialog>
  <dialog id="costs" aria-labelledby="costs-title"></dialog>
  <dialog id="palette" class="palette" aria-label="Commands"></dialog>

  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <h1 id="gate-title">portway</h1>
      <p id="gate-text"></p>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
