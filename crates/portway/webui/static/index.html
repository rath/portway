<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>portway</title>
  <link rel="icon" id="favicon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/boot.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#events-list">Skip to events</a>

  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12 L6 4 L10 12 L14 4" /></svg>
      <span>portway</span>
    </div>
    <div class="listen">
      <code id="listen">—</code>
      <button type="button" class="icon" id="copy-listen" title="Copy the forwarder address" aria-label="Copy the forwarder address">⧉</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grow"></div>
    <span class="pill" id="conn" role="status" aria-live="polite">connecting</span>
    <button type="button" id="reload" class="ghost" title="Reread the configuration (r)">Reload</button>
    <button type="button" id="stop" class="ghost danger" title="Stop the forwarder (q)">Stop</button>
    <button type="button" id="open-palette" class="ghost" title="Commands (⌘K / Ctrl-K)" aria-label="Commands">⌘K</button>
  </header>

  <nav class="tabs" aria-label="Views">
    <a href="#/" data-view="dashboard">Dashboard</a>
    <a href="#/usage" data-view="usage">Usage</a>
    <a href="#/history" data-view="history">History</a>
    <a href="#/insights" data-view="insights">Insights</a>
    <a href="#/appearance" data-view="appearance">Appearance</a>
  </nav>

  <div class="banner" id="banner" hidden></div>

  <main id="main">
    <section id="view-dashboard" class="view" aria-label="Dashboard">
      <div class="hud" id="hud"></div>

      <section class="panel models" aria-labelledby="models-title">
        <h2 id="models-title">models</h2>
        <div class="table-wrap"><table id="models"></table></div>
      </section>

      <section class="charts">
        <figure class="panel chart">
          <figcaption>
            <h2>request body / turn</h2>
            <span class="legend"><i class="swatch raw"></i>raw <i class="swatch wire"></i>wire <span id="bars-note"></span></span>
          </figcaption>
          <canvas id="bars-chart" role="img" aria-label="Request body size per turn, raw against wire"></canvas>
        </figure>
        <figure class="panel chart">
          <figcaption>
            <h2>socket bytes/s</h2>
            <span class="legend">
              <span class="segmented" role="group" aria-label="Bucket width" id="scale"></span>
            </span>
          </figcaption>
          <canvas id="traffic-chart" role="img" aria-label="Socket bytes per second, up and down"></canvas>
        </figure>
      </section>

      <section class="panel events" aria-labelledby="events-title">
        <div class="toolbar">
          <h2 id="events-title">events</h2>
          <div class="segmented" role="group" aria-label="Filter" id="modes"></div>
          <label class="search">
            <span class="sr-only">Search events</span>
            <input type="search" id="query" placeholder="search  status:5xx  model:  ttfb:>2s  is:cut   ( / )" autocomplete="off" spellcheck="false">
          </label>
          <button type="button" class="ghost" id="columns-button" title="Choose what a line shows (c)">Columns</button>
          <button type="button" class="ghost" id="export-csv" title="Download the filtered events as CSV">CSV</button>
          <button type="button" class="ghost" id="export-json" title="Download the filtered events as JSON">JSON</button>
        </div>
        <div class="query-errors" id="query-errors" role="alert"></div>
        <div class="list-status">
          <span id="position"></span>
          <span id="counts"></span>
          <button type="button" class="link" id="load-older">load older</button>
        </div>
        <div class="list" id="events-list" tabindex="0" role="listbox" aria-label="Events, newest last">
          <div class="head" id="events-head" aria-hidden="true"></div>
          <div class="spacer" id="events-spacer"></div>
          <div class="rows" id="events-rows"></div>
        </div>
        <div class="flights" id="flights">
          <button type="button" class="flights-head" id="flights-toggle" aria-expanded="true" aria-controls="flights-rows">
            <span id="flights-title">IN FLIGHT · 0</span>
          </button>
          <div class="flights-rows" id="flights-rows"></div>
        </div>
      </section>
    </section>

    <section id="view-usage" class="view" aria-label="Usage" hidden></section>
    <section id="view-history" class="view" aria-label="History" hidden></section>
    <section id="view-insights" class="view" aria-label="Insights" hidden></section>
    <section id="view-appearance" class="view" aria-label="Appearance" hidden></section>
  </main>

  <footer class="keys" id="keys" aria-label="Keys"></footer>

  <dialog id="detail" class="drawer" aria-labelledby="detail-title"></dialog>
  <dialog id="help" aria-labelledby="help-title"></dialog>
  <dialog id="columns" aria-labelledby="columns-title"></dialog>
  <dialog id="stop-dialog" aria-labelledby="stop-title"></dialog>
  <dialog id="costs" aria-labelledby="costs-title"></dialog>
  <dialog id="palette" class="palette" aria-label="Commands"></dialog>

  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <h1 id="gate-title">portway</h1>
      <p id="gate-text"></p>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
