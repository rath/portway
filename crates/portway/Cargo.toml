[package]
name = "portway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "A compression-first HTTP forwarder"

[features]
default = []
tui = ["dep:ratatui", "dep:bytes", "dep:hyper"]
web = ["dep:bytes", "dep:http-body", "dep:hyper", "dep:hyper-util"]

[dependencies]
portway-core = { path = "../portway-core", version = "0.2.3" }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
clap = { version = "4.6.7", features = ["derive"] }
http = "1.5.0"
http-body-util = "0.1.5"
libc = "0.2.189"
ratatui = { optional = true, version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
# No `cache` feature (statement caching is not used here) and no wasm backend;
# `bundled` compiles the SQLite C sources once into target/.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde_json = "1.0.151"
# The web console's own listener; the forwarder already links all four.
bytes = { optional = true, version = "1.12.1" }
http-body = { optional = true, version = "1.1.0" }
hyper = { optional = true, version = "1.11.1", features = ["http1", "server"] }
hyper-util = { optional = true, version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }


[dev-dependencies]
regex = "1.13.1"
bytes = "1.12.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
sha2 = "0.11.0"
zstd = "0.14.0"

# glibc keeps what a thread frees in that thread's arena; with request bodies
# of several megabytes going through zstd, a forwarder using 17MB held 400MB.
# jemalloc hands freed pages back. Unprefixed, it is also the `malloc` of the
# C libraries (zstd, SQLite), where zstd keeps its multi-megabyte state.
# The problem is glibc's; macOS keeps its system allocator.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7.0", features = ["unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-sys = "0.7.1"
