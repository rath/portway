<!doctype html>
<!--
  Source of site/og-zh.png, the Chinese page's 1200x630 social preview
  (https://portway.told.me/zh/): og-card.html in the words the Chinese page
  uses, set in Noto Sans SC. Render with:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=site/og-zh.png "file://$PWD/scripts/og-card-zh.html"
-->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Fragment+Mono&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;800&display=block">
<style>
  :root {
    --ground: #0f1820; --rule: #263846; --ink: #e3eaef; --ink-dim: #97a9b6;
    --raw: #6f9cf2; --zstd: #9d8ccc; --wire: #2cc3a3;
    --sans: "Archivo", "Noto Sans SC", sans-serif; --mono: "Fragment Mono", monospace;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--sans);
    padding: 64px 72px; box-sizing: border-box;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 700; font-stretch: 110%; }
  .brand svg { width: 37.5px; height: 30px; }
  .brand path { fill: none; stroke: var(--raw); stroke-width: 4; stroke-linecap: round; }
  .brand .delta { stroke: var(--wire); }
  h1 {
    margin: 40px 0 0; font-size: 62px; line-height: 1.04; font-weight: 800;
    font-stretch: 88%; letter-spacing: -0.01em; max-width: 24ch;
  }
  h1 span { display: inline-block; }
  .bars { margin-top: auto; display: grid; grid-template-columns: 320px 1fr 140px; gap: 14px 24px; align-items: center; }
  .bars span { font-size: 24px; color: var(--ink-dim); }
  .bars b { font-family: var(--mono); font-weight: 400; font-size: 26px; text-align: right; }
  .bar { height: 22px; border-radius: 3px; }
  .raw  { background: var(--raw);  width: 100%; }
  .zstd { background: var(--zstd); width: 22.4%; }
  .wire { background: var(--wire); width: 0.73%; min-width: 6px; }
  .wire-n { color: var(--wire); }
  footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; font-size: 22px; color: var(--ink-dim); }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="3.5 6 25 20" aria-hidden="true"><path d="M5.5 8H11.5M5.5 16H17.5M5.5 24H17.5"/><path class="delta" d="M24 24H26.5"/></svg>
    Portway
  </div>
  <h1><span>减少编程智能体的</span><span>网络传输量。</span></h1>
  <div class="bars">
    <span>智能体发送的字节</span><div class="bar raw"></div><b>13.2 MiB</b>
    <span>仅用 zstd</span><div class="bar zstd"></div><b>3.0 MiB</b>
    <span>Portway 实际发出的字节</span><div class="bar wire"></div><b class="wire-n">99 KiB</b>
  </div>
  <footer><span>用真实二进制回放的一次 40 轮会话</span><span>portway.told.me</span></footer>
</body>
</html>
