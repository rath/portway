<!doctype html>
<!--
  Source of site/og-ko.png, the Korean page's 1200x630 social preview
  (https://portway.told.me/ko/): og-card.html in the words the Korean page
  uses, set in Pretendard. Render with:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=site/og-ko.png "file://$PWD/scripts/og-card-ko.html"
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Fragment+Mono&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --ground: #0f1820; --rule: #263846; --ink: #e3eaef; --ink-dim: #97a9b6;
    --raw: #6f9cf2; --zstd: #9d8ccc; --wire: #2cc3a3;
    --sans: "Archivo", "Pretendard", sans-serif; --mono: "Fragment Mono", monospace;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--sans);
    padding: 64px 72px; box-sizing: border-box;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 700; font-stretch: 110%; }
  .brand svg { width: 48px; height: 48px; }
  h1 {
    margin: 40px 0 0; font-size: 62px; line-height: 1.04; font-weight: 800;
    font-stretch: 88%; letter-spacing: -0.01em; max-width: 24ch;
    word-break: keep-all;
  }
  h1 span { display: inline-block; }
  .bars { margin-top: auto; display: grid; grid-template-columns: 250px 1fr 140px; gap: 14px 24px; align-items: center; }
  .bars span { font-size: 24px; color: var(--ink-dim); }
  .bars b { font-family: var(--mono); font-weight: 400; font-size: 26px; text-align: right; }
  .bar { height: 22px; border-radius: 3px; }
  .raw  { background: var(--raw);  width: 100%; }
  .zstd { background: var(--zstd); width: 22.4%; }
  .wire { background: var(--wire); width: 0.73%; min-width: 6px; }
  .wire-n { color: var(--wire); }
  footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; font-size: 22px; color: var(--ink-dim); }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1d5fd0"/><path d="M6 23 L12 9 L18 23 L24 9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Portway
  </div>
  <h1><span>코딩 에이전트의</span> <span>네트워크 전송량을</span> <span>줄이세요.</span></h1>
  <div class="bars">
    <span>에이전트가 보낸 양</span><div class="bar raw"></div><b>13.2 MiB</b>
    <span>zstd만 썼을 때</span><div class="bar zstd"></div><b>3.0 MiB</b>
    <span>실제로 전송된 양</span><div class="bar wire"></div><b class="wire-n">99 KiB</b>
  </div>
  <footer><span>실제 바이너리로 재생한 40턴짜리 세션 하나</span><span>portway.told.me</span></footer>
</body>
</html>
