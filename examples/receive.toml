# Decode compressed requests in front of an existing HTTP application.
# Run: portway receive --config examples/receive.toml --data-dir ./receiver-data
# The "receive" argument selects the mode; [receiver] alone does not.
# This mode requires an upstream, an [upstreams] table that mounts each origin
# under its own path, or a [models] table that routes each request by its JSON
# model field to the origin configured for it.

# The application receives restored requests, uncompressed by default.
upstream = "http://127.0.0.1:8000"
host = "127.0.0.1"
port = 8788

# Place a TLS/authentication gateway in front of this loopback listener.
# Authenticate application requests before they reach the receiver.
# Allow GET /__portway/capabilities without a key for sender discovery.
# Point the sending Portway at that gateway's public URL.
# See docs/authentication.md for preserving caller identity across the gateway.

# Optional: all values below are defaults, in bytes except the TTL.
[receiver]
dictionary_bytes = 67108864        # 64MiB total memory; 0 disables dictionaries
dictionaries_per_scope = 16        # Newest bodies kept per credential context
dictionary_ttl_seconds = 3600      # Idle lifetime; dictionaries are memory-only
min_dictionary_bytes = 32768       # Requests below 32KiB cannot seed a dictionary
max_dictionary_bytes = 33554432    # 32MiB per dictionary
max_body_bytes = 268435456         # 256MiB limit for encoded and decoded bodies
max_window_bytes = 134217728       # 128MiB zstd window limit

# Optional receiver-to-origin compression. Enable for adaptive gzip/zstd uploads.
# A 415 retries identity once and suspends compression for 10 minutes.
# A 400 suspends compression without replay. Other errors are not replayed.
# [receiver.origin_compression]
# mode = "auto" # default: "off"
