name: Pages

# Publishes site/ to GitHub Pages at https://portway.told.md/.
#
# One-time setup, outside this file:
#   1. Settings > Pages > Source: "GitHub Actions".
#   2. Settings > Pages > Custom domain: portway.told.md. A CNAME file is
#      ignored by Actions deployments, so the domain lives in the settings.
#   3. DNS: a CNAME record for portway.told.md pointing at rath.github.io.
#
# The site has no build step: the files in site/ are served as they are.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a deployment half way; the next push queues behind it.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
