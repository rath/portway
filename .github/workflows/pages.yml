name: Pages

# Publishes site/ to GitHub Pages at https://portway.told.me/.
#
# One-time setup, outside this file:
#   1. Settings > Pages > Source: "GitHub Actions".
#   2. Settings > Pages > Custom domain: portway.told.me. A CNAME file is
#      ignored by Actions deployments, so the domain lives in the settings.
#   3. DNS: a CNAME record for portway.told.me pointing at rath.github.io.
#
# The site has no build step: the files in site/ are served as they are.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a deployment half way; the next push queues behind it.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
