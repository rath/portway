name: Release

# A pushed `v<version>` tag builds the CLI for each platform below and
# publishes them, with checksums, as the GitHub release of that tag. The
# release notes are the tag's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Both dashboards are in the published binary: a user who wants neither
  # simply never passes --tui or --web.
  FEATURES: tui,web

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: version
        name: Tag matches Cargo.toml and CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match version $manifest in Cargo.toml" >&2
            exit 1
          fi
          if ! grep -q "^## \[$tag\] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$tag] - <date>' section" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds link against glibc 2.28 through cargo-zigbuild, so one
          # binary runs on anything from RHEL 8 and Debian 10 onwards,
          # including Amazon Linux 2023 (2.34), whose glibc is older than any
          # current runner's.
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.28
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.28
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # build.rs stamps the version from `git describe`, which needs the tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.zig_target
        with:
          python-version: "3.13"
      - name: Install cargo-zigbuild
        if: matrix.zig_target
        run: python -m pip install cargo-zigbuild==0.23.4 ziglang==0.16.0
      - name: Build
        run: |
          if [ -n "${{ matrix.zig_target }}" ]; then
            # jemalloc's configure picks its own archiver rather than
            # cargo-zigbuild's; keep it on zig's, which reads every target.
            AR="cargo-zigbuild zig ar --" RANLIB="cargo-zigbuild zig ranlib --" \
              cargo zigbuild --release --locked -p portway --features "$FEATURES" --target "${{ matrix.zig_target }}"
          else
            cargo build --release --locked -p portway --features "$FEATURES" --target "${{ matrix.target }}"
          fi
      - name: Check the binary
        run: |
          bin="target/${{ matrix.target }}/release/portway"
          file "$bin"
          if [ "${{ matrix.target }}" != aarch64-unknown-linux-gnu ]; then
            "$bin" --version
            "$bin" --version | grep -qx "portway ${{ needs.verify.outputs.version }}"
          fi
      # Asset names carry no version, so releases/latest/download/<name> is a
      # link that never goes stale; the version is in the binary and the tag.
      - name: Package
        run: |
          name="portway-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/portway" LICENSE README.md CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${{ needs.verify.outputs.version }}"
          awk -v head="## [$version] - " '
            index($0, head) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside && /^\[[^]]+\]: / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat dist/*.sha256 > dist/SHA256SUMS
          ls -l dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          title="Portway ${{ needs.verify.outputs.version }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file notes.md
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" --verify-tag --title "$title" --notes-file notes.md \
              dist/*.tar.gz dist/SHA256SUMS
          fi
