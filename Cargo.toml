[workspace]
members = ["crates/portway-core", "crates/portway"]
default-members = ["crates/portway"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Latency first: this process sits in the request path of every agent turn.
# `panic` stays at the default unwind on purpose — with `abort`, one malformed
# upstream response would kill every in-flight stream, and the codegen win is
# negligible next to fat LTO.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
